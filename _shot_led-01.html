function renderContent(){
  Object.keys(SHEETS).forEach(key=>renderPanel(key, SHEETS[key]));
  if(typeof ASSET_SHEETS!=='undefined'){
    Object.keys(ASSET_SHEETS).forEach(key=>renderPanel(key, ASSET_SHEETS[key]));
  }
  if(typeof TRUST_SHEETS!=='undefined'){
    Object.keys(TRUST_SHEETS).forEach(key=>renderPanel(key, TRUST_SHEETS[key]));
  }
  if(typeof INSURANCE_SHEETS!=='undefined'){
    Object.keys(INSURANCE_SHEETS).forEach(key=>renderPanel(key, INSURANCE_SHEETS[key]));
  }
  if(typeof LEASE_SHEETS!=='undefined'){
    Object.keys(LEASE_SHEETS).forEach(key=>renderPanel(key, LEASE_SHEETS[key]));
  }
  /* 报表台账管理：全部固定报表的台账面板（无 KPI，仅表格；横向按月） */
  renderAllLedgers();
  // 驾驶舱面板（集团总览 + 各公司）
  if(typeof COCKPITS!=='undefined'){
    COCKPITS.forEach(c=>renderCockpitPanel(c));
  }
}

/* 渲染单个报表面板；has=false（所选期间无历史数据）时保留 KPI 卡片、表头与指标行结构，
   仅数值类内容（KPI 值、同比/较年初、数值/增减/进度单元格）显示为「-」 */
function renderPanel(key, s){
  const content = document.getElementById('content');
  let panel = document.getElementById('panel-'+key);
  const existed = !!panel && !!panel.parentNode; // 已挂载 → 重渲染；未挂载 → 新建并追加
  const wasActive = existed && panel.classList.contains('active');
  if(!panel){
    panel = document.createElement('div');
  }
  panel.className = 'sheet-panel';
  panel.id = 'panel-'+key;
  const has = sheetHasData(key, s);

  let html = '';

  // Panel header：更新频率（独立块，在前）+ 数据日期年+月双下拉；期间变更后自动查询
  // 季度频率报表（freq=季度）：月份下拉改为 Q1~Q4（取值=季末月，保证历史数据判断正确）
  const quarterly = s.freq === '季度';
  const ymYearOpts = [2022,2023,2024,2025,2026].map(y=>`<option value="${y}"${y===2025?' selected':''}>${y}年</option>`).join('');
  const ymMonthOpts = quarterly
    ? [3,6,9,12].map((m,i)=>`<option value="${m}"${m===12?' selected':''}>Q${i+1}</option>`).join('')
    : Array.from({length:12},(_,m)=>`<option value="${m+1}"${m===11?' selected':''}>${m+1}月</option>`).join('');
  const freqBox = `
    <div class="query-freq-box">
      <span class="query-freq-label">更新频率</span><span class="query-freq-value">${s.freq || '月度'}</span>
    </div>`;
  const ymCtl = `
    <div class="ym">
      <span class="ym-label">📅 数据日期</span>
      <select class="ym-select" data-key="${key}" data-part="year" title="选择年份">${ymYearOpts}</select>
      <select class="ym-select" data-key="${key}" data-part="month" title="${quarterly?'选择季度':'选择月份'}">${ymMonthOpts}</select>
    </div>`;
  html += `
    <div class="panel-header">
      <div class="panel-title">${panelName(s)}</div>
      <div class="panel-actions">
        ${freqBox}
        ${ymCtl}
        <button class="btn" data-action="export" data-key="${key}">📥 导出</button>
      </div>
    </div>
  `;

  // 概览区（KPI 卡片）—— 支持收起/展开，默认展开；报表无 kpi 时不渲染该模块（如华润信托 收入结构/业务结构）；
  // s.noOverview=true 时页面不渲染概览模块但保留 kpi 数据供驾驶舱引用（如华润租赁 04-风险指标，2026-09-24）
  // 口径化 KPI（calibers 内 c.kpi）：每个口径一套，切换口径页签时概览数值同步切换
  const calKpis = s.calibers && s.calibers.some(c=>c.kpi && c.kpi.length);
  const kpiList = calKpis ? s.calibers[0].kpi : (s.kpi || []);
  if(kpiList.length && !s.noOverview){
    html += `
      <div class="collapse-bar expanded" data-action="toggle-overview" data-key="${key}">
        <span class="collapse-arrow">▶</span>
        <span>指标概览</span>
        <span class="collapse-hint">点击收起 ▴</span>
      </div>
      <div class="overview-area" id="overview-${key}">
    `;

    // KPI cards：无数据期间数值显示 N/A（同比/较年初由 deltaSpan 置 N/A）；华润资产卡片与华润保险业务指标(ins02)、华润银行损益表简表(02)/收入结构(04)/成本结构(05)删除较年初行；
    // 华润租赁收入结构(lease01)改用单卡片级 k.noYtd（营业收入/利润总额不显示较年初，质效比率卡片保留），不走整表 hideYtd
    const hideYtd = key.indexOf('asset') === 0 || key === 'ins02' || key === 'trust01' || key === '02' || key === '05' || key === '04';
    const cardsHtml = list => list.map(k=>kpiCardHtml(has ? k : {label:k.label, value:'N/A', unit:k.unit, trend:null, ytd:null, type:k.type, noYtd:k.noYtd, trendLabel:k.trendLabel}, {noYtd:hideYtd})).join('');
    if(calKpis){
      s.calibers.forEach((c,ci)=>{
        html += `<div class="kpi-row caliber-pane${ci===0?' active':''}" data-pane="${ci}">${cardsHtml(c.kpi)}</div>`;
      });
    } else {
      html += `<div class="kpi-row${s.kpi.length>4?' kpi-row-'+s.kpi.length:''}">${cardsHtml(s.kpi)}</div>`;
    }

    html += `</div>`; // overview-area
  }

  // Data table：无数据期间表头/指标行保留，数值类单元格显示「-」
  html += `<div class="table-card">`;
  if(s.calibers){
    // 按指标口径分页签：表格上方显示口径名称，点击切换对应口径的指标明细
    html += `<div class="caliber-tabs" data-key="${key}">`;
    s.calibers.forEach((c,ci)=>{
      html += `<button type="button" class="caliber-tab${ci===0?' active':''}" data-action="caliber-switch" data-pane="${ci}">
        <span class="caliber-tab-name">${c.label}</span>
        <span class="caliber-tab-sub">${c.sub||''}</span>
      </button>`;
    });
    html += `</div>`;
    s.calibers.forEach((c,ci)=>{
      html += `<div class="table-wrap caliber-pane${ci===0?' active':''}" data-pane="${ci}">`;
      const hide = (s.hideCols || []).concat(c.hideCols || []);
      const view = hide.length ? hideColsView(s, hide, c) : {headers:s.headers, rows:c.rows, levels:c.levels, spans:c.spans};
      html += renderTable(view, getColTypes(view.headers), has);
      html += `</div>`;
    });
  } else {
    const baseView = s.hideCols ? hideColsView(s, s.hideCols) : s;
    // 指标分类筛选条（s.catFilter）：表格上方按分类过滤明细行；状态存 catFilterState，期间查询重渲染后保持
    if(s.catFilter){
      const cur = catFilterState[key] || s.catFilter.options[0];
      html += `<div class="cat-filter" data-key="${key}">
        <span class="cat-filter-label">${s.catFilter.label||'指标分类'}：</span>
        ${s.catFilter.options.map(o=>`<button type="button" class="cat-filter-btn${o===cur?' active':''}" data-action="cat-filter" data-key="${key}" data-cat="${o}">${o}</button>`).join('')}
      </div>`;
    }
    const view = s.catFilter ? filterCatView(baseView, catFilterState[key], s.catFilter.col) : baseView;
    html += `<div class="table-wrap">`;
    html += renderTable(view, getColTypes(view.headers), has);
    html += `</div>`;
  }
  html += `</div>`; // table-card

  panel.innerHTML = html;
  if(!existed) content.appendChild(panel);
  if(wasActive) panel.classList.add('active');
}

/* KPI 卡片：报表概览与驾驶舱共用；占位符统一 dim 样式；opts.noYtd=整表不渲染较年初行（华润资产报表）；
   k.noYtd=单卡片不渲染较年初行、k.trendLabel=同比行自定义标签（如华润租赁收入结构「累计同比」，2026-09-24） */
function kpiCardHtml(k, opts){
  const vDisp = dispPlain(k.value);
  const noYtd = !!(opts && opts.noYtd) || k.noYtd === true;
  const trendName = k.trendLabel || '同比';
  return `
    <div class="kpi-card ${k.type||''}">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-value">${vDisp}<span class="kpi-unit">${k.unit}</span></div>
      <div class="kpi-trends">
        <div class="kpi-trend-row"><span class="kpi-trend-name">${trendName}</span>${deltaSpan(k.trend)}</div>
        ${noYtd ? '' : `<div class="kpi-trend-row"><span class="kpi-trend-name">较年初</span>${deltaSpan(k.ytd)}</div>`}
      </div>
    </div>
  `;
}

/* ============================================================
   报表台账管理（一级菜单，与固定报表管理同级，2026-09-30）
   基于「固定报表管理」全部页面复制生成，页面规则：
   · 组件：移除全部指标卡片，仅保留台账表格区域；
       顶部展示更新频率；不展示数据范围；
   · 数据范围：固定使用「截止本月末」累计数据；
   · 表头动态：按年度筛选横向展示年内各月——
       当前年度展示 1 月至本月；历史年度展示 1—12 月完整月份；
       每月一列：本月末累计值（不显示同比）；不显示指标属性标签列；
       季度频率报表（freq=季度）表头为季度列，默认展示至「最近一个已完结季度」：
       当前年度展示 Q1 至上一个已完结季度（如 10 月时 Q4 未完结，仅展示 Q1—Q3）；
       若当前在 1—3 月（本年尚无已完结季度）→ 默认回看上一完整年度 Q1—Q4；
       历史年度展示 Q1—Q4 完整季度；
   · 底层模型：指标、维度与数据模型复用原固定报表
       （calibers 口径 / hideCols / spans 合并 / levels 层级同源）；
       月内数值为演示推算：累计流量=年末值×m/12，存量/比率年内缓变（12 月=原值）。
   面板 key 前缀 led-（如 led-01 / led-ins02），与固定报表面板并存互不影响。
   ============================================================ */
const LEDGER_NOW = new Date();
const LEDGER_NOW_Y = LEDGER_NOW.getFullYear();
const LEDGER_NOW_M = LEDGER_NOW.getMonth() + 1;
const ledgerYearSel = {}; // 'led-key' → 当前所选年度
const ledgerCalSel = {};  // 'led-key' → 当前所选口径下标（calibers 报表，如华润资产）

/* 台账可选年度：2022 起至 max(2026, 当前年) */
function ledgerYears(){
  const ys = [];
  for(let y=2022; y<=Math.max(2026, LEDGER_NOW_Y); y++) ys.push(y);
  return ys;
}
/* 年度演示系数：2025 基准=1，往年逐年递减、近年递增（回溯历史年度可见数值差异） */
function ledgerYf(y){
  if(y >= 2025) return 1 + 0.06*(y-2025);
  return Math.max(0.55, 1 - 0.11*(2025-y));
}
/* 台账表头月份数：当前年度展示 1 月至本月；历史年度展示 1—12 月 */
function ledgerMonthCount(y){
  return y === LEDGER_NOW_Y ? Math.min(12, Math.max(1, LEDGER_NOW_M)) : 12;
}
/* 最近已完结季度：季度需季末月已过才算完结（当前 10 月 → Q3 完结、Q4 未完结） */
function lastClosedQuarter(){
  return Math.floor((LEDGER_NOW_M - 1) / 3); // 1—3 月→0（本年无已完结季度）；4—6→1；7—9→2；10—12→3
}
/* 台账表头季度数（freq=季度）：展示至最近已完结季度（1—3 月选本年时=0，无已完结季度）；
   历史年度展示 Q1—Q4 */
function ledgerQuarterCount(y){
  if(y !== LEDGER_NOW_Y) return 4;
  return Math.min(4, lastClosedQuarter());
}
/* 季度台账默认年度：1—3 月本年尚无已完结季度 → 默认回看上一完整年度（Q1—Q4）；
   与月度台账「默认展示至本月」的差异在于：季度只认已完结期间 */
function ledgerDefaultYear(s){
  if(s.freq === '季度' && lastClosedQuarter() === 0) return LEDGER_NOW_Y - 1;
  return LEDGER_NOW_Y;
}
/* 月度推算系数：flow=累计流量（m/12，12 月=年末值）；存量/比率=年内缓变（12 月=原值） */
function ledgerMF(m, flow){ return flow ? m/12 : (0.97 + 0.0025*m); }
/* 演示数值格式化：按原值的小数位与千分位风格输出 */
function ledFmt(orig, scaled){
  const s = String(orig==null?'':orig).trim();
  const dec = ((s.split('.')[1]||'').match(/\d+/g)||['']).join('').length;
  let out = scaled.toFixed(dec);
  if(s.indexOf(',') >= 0){
    const p = out.split('.');
    p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    out = p.join('.');
  }
  return out;
}
/* 台账基础视图：与 renderPanel 同源取数（calibers 按所选口径、hideCols 隐藏列复用） */
function ledgerBaseView(s, ci){
  if(s.calibers && s.calibers.length){
    const c = s.calibers[ci||0] || s.calibers[0];
    const hide = (s.hideCols||[]).concat(c.hideCols||[]);
    return hide.length ? hideColsView(s, hide, c) : {headers:s.headers, rows:c.rows, levels:c.levels, spans:c.spans};
  }
  return s.hideCols ? hideColsView(s, s.hideCols) : s;
}
/* 展开两级表头为叶子列 [{group,label}]（与 getColTypes 同一套展开规则） */
function ledgerLeaves(view){
  const row1 = view.headers[0], row2 = view.headers[1] || [];
  const cols = [];
  let j = 0;
  row1.forEach(h=>{
    const c = h.c||1, r = h.r||1;
    for(let k=0;k<c;k++){
      cols.push({group:h.l, label:(r>1 ? h.l : (row2[j] ? row2[j].l : h.l))});
      if(r <= 1) j++;
    }
  });
  return cols;
}
/* 构建台账视图：保留序号/指标名称/单位/指标分类等结构维度列（不显示指标属性标签），
   将「截止本月末-实际」按月展开为 1—N 月（每月一列本月末值，不显示同比） */
function buildLedgerView(s, y, ci){
  const view = ledgerBaseView(s, ci);
  const leaves = ledgerLeaves(view);
  const KEEP = ['序号','指标分类','指标分项','指标名称','单位'];
  const keepIdx = [];
  leaves.forEach((L,i)=>{ if(KEEP.indexOf(L.label) >= 0) keepIdx.push(i); });
  /* 截止本月末（季度表为截止本季末）的「实际」列 = 台账取数列 */
  let endIdx = -1;
  leaves.forEach((L,i)=>{ if(L.label==='实际' && /截止/.test(L.group)) endIdx = i; });
  if(endIdx < 0) leaves.forEach((L,i)=>{ if(L.label==='实际') endIdx = i; });
  const unitIdx = leaves.findIndex(L=>L.label==='单位');

  const mC = s.freq === '季度' ? ledgerQuarterCount(y) : ledgerMonthCount(y);
  const quarterly = s.freq === '季度';
  const yf = ledgerYf(y);
  /* 数据可用性（与固定报表 sheetHasData 同源）：早于报表起始期间 dataFrom（默认 2025-01）
     的「年+月」无数据 → 数值列渲染为 N/A（结构列序号/名称/单位/分类保留），支持逐年回溯 */
  const [fy, fm] = (s.dataFrom || DATA_DEFAULT_FROM).split('-').map(Number);
  const monthHasData = m => periodVal(y, m) >= periodVal(fy, fm);

  /* 期间列：月度 → 1—N 月「X月末」；季度（freq=季度）→ Q1—Q4（取数期间 = 季末月） */
  const periods = [];
  for(let k=1;k<=mC;k++) periods.push(quarterly ? {l:'Q'+k, m:k*3} : {l:k+'月末', m:k});

  /* 表头：结构列 + 各期间单列（无同比；台账为单级表头） */
  const h1 = keepIdx.map(i=>({l:leaves[i].label}));
  periods.forEach(P=>h1.push({l:P.l}));
  const headers = [h1];

  const rows = (view.rows||[]).map(r=>{
    if(!r.length || r.every(v=>v===null||v==='')) return r.slice(); // 子表分隔空行保留
    const out = keepIdx.map(i=>r[i]);
    const raw = endIdx >= 0 ? r[endIdx] : '';
    const rawStr = String(raw==null?'':raw).trim();
    const rawNum = parseFloat(rawStr.replace(/[,，]/g,'').replace(/%|ppt/gi,''));
    const unit = unitIdx >= 0 ? String(r[unitIdx]||'') : '';
    const isRatio = /%|ppt/.test(unit) || /%|ppt/.test(rawStr);
    const flow = !isRatio;
    periods.forEach(P=>{
      if(!monthHasData(P.m)){ out.push(null); return; }               // 无历史数据期间 → N/A
      /* 当月未取到数（源值空、-、非数值）→ N/A
         （台账口径：所有指标均应有期末值，仅个别期间未拿到数据，统一 N/A 不用 --） */
      if(isNaN(rawNum) || rawStr==='' || rawStr==='-'){ out.push(null); return; }
      out.push(ledFmt(rawStr, rawNum * yf * ledgerMF(P.m, flow)));
    });
    return out;
  });

  /* rowspan 合并列号重映射：仅保留结构列内的合并（指标分类/分项等） */
  let spans = null;
  if(view.spans){
    spans = view.spans.map(sp=>{
      const nc = keepIdx.indexOf(sp.col);
      return nc >= 0 ? {col:nc, row:sp.row, rs:sp.rs} : null;
    }).filter(Boolean);
  }
  return {headers, rows, levels:view.levels, spans};
}

/* 渲染单个台账面板：无 KPI 卡片，仅 台账头部（年度筛选+导出） + 表格 */
function renderLedgerPanel(key, s){
  const lk = 'led-'+key;
  const content = document.getElementById('content');
  let panel = document.getElementById('panel-'+lk);
  const existed = !!panel && !!panel.parentNode;
  const wasActive = existed && panel.classList.contains('active');
  if(!panel) panel = document.createElement('div');
  panel.className = 'sheet-panel';
  panel.id = 'panel-'+lk;

  const y = ledgerYearSel[lk] || ledgerDefaultYear(s);
  const calIdx = (s.calibers && s.calibers.length) ? (ledgerCalSel[lk] || 0) : 0;
  const yOpts = ledgerYears().map(yy=>`<option value="${yy}"${yy===y?' selected':''}>${yy}年</option>`).join('');
  const view = buildLedgerView(s, y, calIdx);

  let html = `
    <div class="panel-header">
      <div class="panel-title">${panelName(s)} · 年度台账</div>
      <div class="panel-actions">
        <div class="query-freq-box">
          <span class="query-freq-label">更新频率</span><span class="query-freq-value">${s.freq || '月度'}</span>
        </div>
        <div class="ym">
          <span class="ym-label">📅 数据年度</span>
          <select class="ym-select" data-key="${lk}" data-part="year" title="选择年度">${yOpts}</select>
        </div>
        <button class="btn" data-action="export" data-key="${lk}">📥 导出</button>
      </div>
    </div>`;

  /* 口径页签（与固定报表管理一致）：calibers 报表（如华润资产全部报表）保留口径切换，
     切换口径即按该口径的指标行重算各月末台账值 */
  if(s.calibers && s.calibers.length){
    html += `<div class="table-card">
      <div class="caliber-tabs" data-key="${lk}">`;
    s.calibers.forEach((c,ci)=>{
      html += `<button type="button" class="caliber-tab${ci===calIdx?' active':''}" data-action="ledger-caliber" data-key="${lk}" data-pane="${ci}">
        <span class="caliber-tab-name">${c.label}</span>
        <span class="caliber-tab-sub">${c.sub||''}</span>
      </button>`;
    });
    html += `</div>`;
  } else {
    html += `<div class="table-card">`;
  }
  html += `
      <div class="table-wrap">${renderTable(view, getColTypes(view.headers), true)}</div>
    </div>`;
  panel.innerHTML = html;
  if(!existed) content.appendChild(panel);
  if(wasActive) panel.classList.add('active');
}

/* 全部固定报表 → 台账面板（数据源与左侧公司分组同源） */
function ledgerAllSheets(){
  const out = [];
  const push = col => { if(col) Object.keys(col).forEach(k=>out.push([k, col[k]])); };
  push(typeof SHEETS!=='undefined' ? SHEETS : null);
  push(typeof ASSET_SHEETS!=='undefined' ? ASSET_SHEETS : null);
  push(typeof TRUST_SHEETS!=='undefined' ? TRUST_SHEETS : null);
  push(typeof INSURANCE_SHEETS!=='undefined' ? INSURANCE_SHEETS : null);
  push(typeof LEASE_SHEETS!=='undefined' ? LEASE_SHEETS : null);
  return out;
}
function renderAllLedgers(){ ledgerAllSheets().forEach(([k,s])=>renderLedgerPanel(k, s)); }

/* 台账年度查询：仅年度下拉，重渲染该台账面板 */
function queryLedger(lk){
  const bk = lk.slice(4); // 去掉 'led-' 前缀
  const s = sheetByKey(bk);
  if(!s) return;
  const sel = document.querySelector(`select.ym-select[data-key="${lk}"][data-part="year"]`);
  if(sel) ledgerYearSel[lk] = +sel.value;
  const y = ledgerYearSel[lk] || ledgerDefaultYear(s);
  renderLedgerPanel(bk, s);
  /* 与固定报表查询一致：所选年度全部期间早于数据起始期间 → 提示无历史数据（数值列 N/A） */
  const quarterly = s.freq === '季度';
  const qC = quarterly ? ledgerQuarterCount(y) : 0; // 季度：已完结季度数（1—3 月选本年=0）
  const [fy, fm] = (s.dataFrom || DATA_DEFAULT_FROM).split('-').map(Number);
  const lastP = quarterly ? qC*3 : ledgerMonthCount(y); // 季度取末季季末月判断
  const has = qC > 0 && periodVal(y, lastP) >= periodVal(fy, fm);
  showToast(has
    ? quarterly
      ? `已加载 ${y} 年 Q1—Q${qC} 台账（已完结季度） · ${s.title}`
      : `已加载 ${y} 年 1—${ledgerMonthCount(y)} 月台账 · ${s.title}`
    : quarterly && qC === 0
      ? `${y} 年尚无已完结季度，仅显示报表结构 · ${s.title}`
      : `${y} 年无历史数据，仅显示报表结构 · ${s.title}`);
  refreshSheet(lk);
}

/* ============================================================
   驾驶舱渲染（领导层视角；数值实时引用各公司固定报表）
   ============================================================ */
const COCK_SRC = {
  SHEETS: ()=> (typeof SHEETS!=='undefined'?SHEETS:null),
  ASSET_SHEETS: ()=> (typeof ASSET_SHEETS!=='undefined'?ASSET_SHEETS:null),
  TRUST_SHEETS: ()=> (typeof TRUST_SHEETS!=='undefined'?TRUST_SHEETS:null),
  INSURANCE_SHEETS: ()=> (typeof INSURANCE_SHEETS!=='undefined'?INSURANCE_SHEETS:null),
  LEASE_SHEETS: ()=> (typeof LEASE_SHEETS!=='undefined'?LEASE_SHEETS:null)
};
function cockSheet(p){
  const get = COCK_SRC[p.s];
  const col = get ? get() : null;
  return col ? col[p.k] : null;
}
/* 引用解析：kpi 下标 → KPI 对象；gauge → 取仪表监测值；row → 按指标名称取报表行 */
function cockPick(p){
  const sh = cockSheet(p);
  if(!sh) return null;
  if(p.row) return cockRowPick(p, sh);
  if(p.gauge){
    const g = sh.chart;
    if(!g || g.type!=='gauge') return null;
    return {label:g.title.replace(/\(.*?\)/g,'').trim(), value:String(g.value), unit:'%', trend:null, ytd:null, type:''};
  }
  return (sh.kpi && sh.kpi[p.kpi]) || null;
}
/* 展开表头得到各列标签（与 getColTypes 同一套展开规则），定位 名称/单位/当月实际/同比/较年初 列 */
function cockColLabels(sh){
  const row1 = sh.headers[0], row2 = sh.headers[1] || [];
  const cols = [];
  row1.forEach(h=>{ for(let k=0;k<(h.c||1);k++) cols.push({label:h.l, r:h.r||1}); });
  let j = 0;
  cols.forEach(c=>{ if(c.r<=1){ if(row2[j]) c.label = row2[j].l; j++; } });
  const L = cols.map(c=>c.label);
  const v0 = L.indexOf('实际');
  return {name:L.indexOf('指标名称'), unit:L.indexOf('单位'), val:v0, eom:L.indexOf('实际', v0+1), mom:L.indexOf('环比'), yoy:L.indexOf('同比'), ytd:L.indexOf('较年初'), bud:L.indexOf('全年预算'), prog:L.indexOf('预算达成率')};
}
/* 按指标名称取行：默认全表顺序匹配（即第一个口径），p.cal 可限定口径下标 */
function cockRowPick(p, sh){
  const rows = (p.cal!=null && sh.calibers) ? sh.calibers[p.cal].rows
    : (sh.calibers ? sh.calibers.flatMap(c=>c.rows) : (sh.rows||[]));
  const L = cockColLabels(sh);
  const r = rows.find(r=>r[L.name]===p.row);
  if(!r || L.name<0) return null;
  /* 当月实际为占位（-/不适用/空，如成本收入比-拨备前）时，取值回退到月末实际列 */
  const rawV = r[L.val];
  const value = ((rawV==='-'||rawV==='不适用'||rawV==='') && L.eom>0) ? r[L.eom] : rawV;
  return {label:r[L.name], value:value, unit:r[L.unit], mval:rawV, mom:L.mom>=0?r[L.mom]:undefined, trend:r[L.yoy], ytd:r[L.ytd], budget:L.bud>=0?r[L.bud]:undefined, type:''};
}

const COCK_COLORS = ['#1a3a6b','#2a5298','#3b82f6','#c8962e','#10b981','#f59e0b','#8b5cf6','#64748b'];
function renderCockChart(ref){
  const sh = cockSheet(ref);
  const ch = sh ? sh[ref.c] : null;
  if(!ch) return '';
  if(ch.type==='composition') return chartComposition(ch);
  if(ch.type==='bar' || ch.type==='waterfall') return chartBar(ch);
  if(ch.type==='gauge') return chartGauge(ch);
  if(ch.type==='trend') return chartTrend(ch);
  return '';
}
/* 结构占比：横向堆叠条 + 图例 */
function chartComposition(ch){
  const total = ch.data.reduce((a,d)=>a+(+d.value||0),0) || 1;
  let segs = '', leg = '';
  ch.data.forEach((d,i)=>{
    const pct = (+d.value/total*100);
    segs += `<div class="ck-seg" style="width:${pct.toFixed(1)}%; background:${COCK_COLORS[i%COCK_COLORS.length]}" title="${d.name} ${pct.toFixed(1)}%"></div>`;
    leg += `<li><i style="background:${COCK_COLORS[i%COCK_COLORS.length]}"></i><span class="ck-leg-name">${d.name}</span><b>${d.value}</b><em>${pct.toFixed(1)}%</em></li>`;
  });
  return `<div class="chart-card"><div class="chart-title">${ch.title}</div><div class="ck-bar">${segs}</div><ul class="ck-legend">${leg}</ul></div>`;
}
/* 规模对比：纵向柱状 */
function chartBar(ch){
  const max = Math.max(...ch.data.map(d=>+d.value||0)) || 1;
  let bars = '';
  ch.data.forEach((d,i)=>{
    const h = Math.max(4, Math.round((+d.value/max)*100));
    bars += `<div class="ck-vbar"><b>${d.value}</b><div class="ck-vbar-col" style="height:${h}%; background:${COCK_COLORS[i%COCK_COLORS.length]}"></div><span title="${d.name}">${d.name}</span></div>`;
  });
  return `<div class="chart-card"><div class="chart-title">${ch.title}</div><div class="ck-vbars">${bars}</div></div>`;
}
/* 监测仪表：半环 SVG + 阈值说明 */
function chartGauge(ch){
  const min = ch.min||0, max = ch.max||100, v = +ch.value;
  const pct = Math.min(1, Math.max(0, (v-min)/((max-min)||1)));
  const L = Math.PI*70;
  const th = ch.threshold!=null ? ch.threshold : (ch.target!=null ? ch.target : null);
  const thName = ch.threshold!=null ? '监管要求' : '目标值';
  return `<div class="chart-card"><div class="chart-title">${ch.title}</div>
    <div class="ck-gauge">
      <svg viewBox="0 0 200 122" width="220" height="134">
        <path d="M 30 110 A 70 70 0 0 1 170 110" fill="none" stroke="#e5e7eb" stroke-width="14" stroke-linecap="round"/>
        <path d="M 30 110 A 70 70 0 0 1 170 110" fill="none" stroke="#2a5298" stroke-width="14" stroke-linecap="round" stroke-dasharray="${(L*pct).toFixed(1)} 999"/>
        <text x="100" y="92" text-anchor="middle" class="ck-gauge-val">${v}</text>
        <text x="100" y="112" text-anchor="middle" class="ck-gauge-sub">${th!=null ? thName+' '+th+(ch.unit||'%') : '区间 '+min+'~'+max}</text>
      </svg>
    </div></div>`;
}
/* 趋势：双折线 SVG */
function chartTrend(ch){
  const cats = ch.categories||[];
  const all = ch.series.flatMap(s=>s.data.map(Number));
  const max = Math.max(...all), min = Math.min(...all);
  const W = 300, H = 150, P = 26;
  const X = i => P + i*(W-2*P)/Math.max(1,cats.length-1);
  const Y = v => H-P-((+v-min)/((max-min)||1))*(H-2*P);
  const cols = ['#2a5298','#c8962e'];
  let lines = '', leg = '', xl = '';
  ch.series.forEach((s,si)=>{
    const col = cols[si%cols.length];
    const pts = s.data.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
    lines += `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.5"/>`;
    s.data.forEach((v,i)=>{ lines += `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3" fill="${col}"/>`; });
    leg += `<li><i style="background:${col}"></i><span class="ck-leg-name">${s.name}</span></li>`;
  });
  cats.forEach((c,i)=>{ xl += `<text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle" class="ck-axis">${c}</text>`; });
  return `<div class="chart-card"><div class="chart-title">${ch.title}</div><svg viewBox="0 0 ${W} ${H}" class="ck-trend">${lines}${xl}</svg><ul class="ck-legend simple">${leg}</ul></div>`;
}

/* 集团总览：渲染选中公司的驾驶舱指标视图（华润资产按分组分区，其余公司平铺）
   g.calSwitch=true 的分组：上方渲染口径页签，切换页签时该组卡片重渲染为对应口径的值 */
let GQ_VIEW = {c:null, idx:0};
var GK_MCAL = [];  /* 多口径卡片注册表：uid → pick（var 挂全局，便于验证） */
function renderCockCompanyView(c, idx){
  const co = c.companies[idx];
  const box = document.getElementById('fz-company-view');
  if(!box || !co) return;
  GQ_VIEW = {c:c, idx:idx};
  GK_MCAL.length = 0;
  const nameEl = document.getElementById('fz-select-name');
  if(nameEl) nameEl.textContent = co.company;
  const scopeEl = document.getElementById('gq-title-scope');
  if(scopeEl) scopeEl.textContent = co.company;
  const sel = document.getElementById('fz-select-group');
  if(sel) sel.querySelectorAll('.fz-select-opt').forEach((o,i)=>o.classList.toggle('active', i===idx));
  let n = 0;
  const cardOf = (p, cal) => {
    if(p.mcals) return mcalCardHtml(p, 0, GK_MCAL.push(p) - 1);
    const k = cockPick(cal!=null ? Object.assign({}, p, {cal:cal}) : p);
    if(!k) return '';
    if(p.valLabel) k.valLabel = p.valLabel;
    if(p.mvalLabel) k.mvalLabel = p.mvalLabel;
    if(p.tip) k.tip = p.tip;
    if(p.trend12) k.trend12 = true;
    return groupCardHtml(k, n++);
  };
  const cards = (picks, cal) => picks.map(p=>cardOf(p, cal)).join('');
  let html = '';
  if(co.overview){
    html = groupOverviewTableHtml(c);
  } else if(co.groups){
    co.groups.forEach((g, gi)=>{
      html += `<div class="gk-strip">${g.title}${g.title2 ? '<span class="gk-strip-sep"></span>' + g.title2 : ''}</div>`;
      if(g.calSwitch){
        const sh = cockSheet(g.picks[0] || {});
        const cals = (sh && sh.calibers) || [];
        const tabs = cals.map((cal, i)=>`<button type="button" class="gk-caltab${i===0?' active':''}" data-action="gk-cal" data-gid="${gi}" data-cal="${i}" title="${cal.label}${cal.sub||''}">${cal.label}</button>`).join('');
        html += `<div class="gk-calswitch" id="gk-calswitch-${gi}">${tabs}</div>`
              + `<div class="gk-row" id="gk-calrows-${gi}">${cards(g.picks, cals.length?0:null)}</div>`;
      } else {
        /* rowwide 指标：卡片样式不变，3 卡并入同一行展示；其余指标排成卡片行 */
        const wide = g.picks.filter(p=>p.rowwide);
        const rest = g.picks.filter(p=>!p.rowwide);
        if(wide.length) html += `<div class="gk-wide-row">` + wide.map(p=>gkWideRowHtml(p)).join('') + `</div>`;
        if(rest.length) html += `<div class="gk-row">${cards(rest)}</div>`;
      }
    });
  } else {
    html = `<div class="gk-strip">核心指标</div><div class="gk-row">${cards(co.picks||[])}</div>`;
  }
  box.innerHTML = html;
}

/* 集团总览-华润金融：五家核心企业指标一览表 */
function groupOverviewTableHtml(c){
  let html = `<div class="gk-strip">五家核心企业指标一览</div><div class="gk-table-section"><div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>公司</th><th>核心指标</th><th>本年累计数</th><th>同比</th><th>较年初</th></tr></thead><tbody>`;
  c.companies.forEach(co=>{
    if(co.overview) return;
    const picks = co.groups ? co.groups.flatMap(g=>g.picks) : (co.picks||[]);
    picks.forEach(p=>{
      const k = cockPick(p);
      if(!k) return;
      html += `<tr><td>${co.company}</td><td class="indicator-name lv0">${k.label}</td><td class="value">${k.value}<span class="kpi-unit"> ${k.unit}</span></td>${renderDeltaCell(k.trend)}${renderDeltaCell(k.ytd)}</tr>`;
    });
  });
  return html + `</tbody></table></div></div></div>`;
}

/* 集团总览指标卡：
   - 有全年预算的考核指标（成本收入比-拨备前、业绩合同 2 项）：完成度环 + 本年累计数/同比/较年初/全年预算
   - 无预算指标：左侧「本年累计数」渐变大数值块 + 右侧同比/较年初 */
function gkNum(v){ const x = parseFloat(String(v==null?'':v).replace(/[,，\s]/g,'')); return isFinite(x)?x:NaN; }
/* 普通数值位占位统一：-/空 → --；null → N/A（与表格/卡片同一套 dim 样式） */
function dispPlain(v){
  if(v==='-' || v==='') return '<span class="dim-dash">--</span>';
  if(v===null || v===undefined || v==='N/A') return '<span class="dim-na">N/A</span>';
  return v;
}
/* 本年累计数且无全年预算卡片：两行布局（第一行 本年累计数+同比；第二行 当月值+环比） */
function gkTwoRowHtml(k, cap){
  return `<div class="gk-2r">`
    + `<div class="gk-2r-line"><div class="gk-2r-l"><span>${cap}</span><span class="gk-2r-v"><b>${dispPlain(k.value)}</b><i>${k.unit}</i></span></div><div class="gk-2r-r"><span>同比</span>${deltaSpan(k.trend)}</div></div>`
    + `<div class="gk-2r-line"><div class="gk-2r-l"><span>${k.mvalLabel||'当月值'}</span><span class="gk-2r-v"><b class="sm">${dispPlain(k.mval||'-')}</b><i>${k.unit}</i></span></div><div class="gk-2r-r"><span>环比</span>${deltaSpan(k.mom)}</div></div>`
    + `</div>`;
}
function groupCardHtml(k, idx){
  const val = gkNum(k.value), bud = gkNum(k.budget);
  const hasG = isFinite(val) && isFinite(bud) && bud > 0;
  const cap = k.valLabel || '本年累计数';
  /* 本年累计数指标不显示较年初（累计值与年初比较无意义）；本月末等时点值保留 */
  const ytdStat = cap === '本年累计数' ? '' : `<div class="gk-stat"><span>较年初</span>${deltaSpan(k.ytd)}</div>`;
  let left, stats;
  if(hasG){
    left = gkGaugeSvg(val/bud*100, idx);
    stats = `<div class="gk-stat"><span>${cap}</span><b>${dispPlain(k.value)}</b><i>${k.unit}</i></div>`
      + `<div class="gk-stat"><span>同比</span>${deltaSpan(k.trend)}</div>`
      + ytdStat
      + `<div class="gk-stat"><span>全年预算</span><b class="gk-dimv">${k.budget}</b><i>${k.unit}</i></div>`;
  } else {
    if(cap === '本年累计数'){
      /* 本年累计数且无全年预算：两行布局（第一行 本年累计数+同比；第二行 当月值+环比） */
      left = '';
      stats = gkTwoRowHtml(k, cap);
    } else {
      left = `<div class="gk-numblock"><span class="gk-np-cap">${cap}</span><b>${dispPlain(k.value)}</b><i>${k.unit}</i></div>`;
      stats = `<div class="gk-stat"><span>同比</span>${deltaSpan(k.trend)}</div>` + ytdStat;
    }
  }
  return `<div class="gk-card">`
    + `<div class="gk-head">${k.label}${k.tip?`<span class="gk-tip" data-tip="${escHtml(k.tip)}">?</span>`:''}<span class="gk-info">ⓘ</span></div>`
    + `<div class="gk-body">${left}<div class="gk-stats">${stats}</div></div>`
    + (k.trend12 ? gkMiniAreaHtml(k, idx) : '')
    + `</div>`;
}
/* 卡底近12月趋势区域图（渐变面积+折线+期末点+月份标签+悬停列；各月值由指标名确定性生成，期末=报表实时值） */
function gkMiniAreaHtml(k, idx){
  const cur = gkNum(k.value);
  if(!isFinite(cur)) return '';
  const label = k.label;
  const cap = k.valLabel || '本年累计数';   /* 与卡片数值标签一致，悬停浮层同用 */
  let h = 2166136261;
  for(let i=0;i<label.length;i++){ h ^= label.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  const start = cur * (0.72 + (h % 14) / 100);
  const pts = [];
  for(let i=0;i<12;i++){
    const t = i/11;
    let v = start + (cur - start) * Math.pow(t, 1.12);
    if(i < 11){ h = (Math.imul(h, 1103515245) + 12345) >>> 0; v += (((h >>> 16) % 7) - 3) * cur * 0.008; }
    pts.push(Math.max(1, Math.round(v)));
  }
  pts[11] = Math.round(cur);
  /* 各月同比：确定性生成；期末=报表实时同比 */
  const curPct = gkNum((k.trend||'').replace('%',''));
  let h2 = 536119969;
  for(let i=0;i<label.length;i++){ h2 ^= label.charCodeAt(i); h2 = Math.imul(h2, 16777619) >>> 0; }
  const pct12 = [];
  for(let i=0;i<12;i++){
    h2 = (Math.imul(h2, 1103515245) + 12345) >>> 0;
    pct12.push(+(((h2 >>> 16) % 12) * 0.5 + 0.6).toFixed(1));
  }
  pct12[11] = isFinite(curPct) ? +curPct.toFixed(1) : null;
  const W = 240, H = 60, P = 4, PB = 15;   /* PB：底部月份标签区 */
  const yTop = P, yBot = H - PB;
  const max = Math.max(...pts) * 1.15, min = Math.min(...pts) * 0.85;
  const slot = (W - 2*P) / 11;
  const X = i => P + slot * i;
  const Y = v => yBot - (yBot - yTop) * ((v - min) / ((max - min) || 1));
  let line = '', xl = '', hov = '';
  pts.forEach((v,i)=>{
    line += (i?' L':'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1);
    xl += `<text x="${X(i).toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="7" fill="#9bb8d8">${i+1}月</text>`;
    hov += `<rect class="gk-t12-hover" x="${(X(i)-slot/2).toFixed(1)}" y="${yTop}" width="${slot.toFixed(1)}" height="${(yBot-yTop).toFixed(1)}" fill="transparent" data-t12-i="${i}" data-t12-m="${i+1}月" data-t12-v="${v}" data-t12-u="${k.unit||''}" data-t12-c="${cap}" data-t12-p="${pct12[i]==null?'':pct12[i]}"/>`;
  });
  const area = line + ` L${X(11).toFixed(1)} ${yBot} L${X(0).toFixed(1)} ${yBot} Z`;
  let dots = '';
  pts.forEach((v,i)=>{
    dots += `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${i===11?2.6:2}" fill="#fff" stroke="#2f9bf2" stroke-width="${i===11?1.6:1.3}"/>`;
  });
  return `<div class="gk-trend12"><div class="gk-t12-cap">近12月趋势</div>`
    + `<svg viewBox="0 0 ${W} ${H}">`
    + `<defs><linearGradient id="gkT12${idx}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f9bf2" stop-opacity="0.32"/><stop offset="1" stop-color="#2f9bf2" stop-opacity="0.02"/></linearGradient></defs>`

/* 近12月柱状（橙色渐变）+ 趋势折线（蓝色空心点，同比）组合图；含月份标签与悬停列（复用 gk-t12 浮层） */
function gkComboChartHtml(k, uid){
  const cur = gkNum(k.value);
  if(!isFinite(cur)) return '';
  const label = k.label;
  const cap = k.valLabel || '本年累计数';
  const dec = cur < 10 ? 1 : 0;
  let h = 2166136261;
  for(let i=0;i<label.length;i++){ h ^= label.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  const start = cur * (0.70 + (h % 15) / 100);
  const pts = [];
  for(let i=0;i<12;i++){
    const t = i/11;
    let v = start + (cur - start) * Math.pow(t, 1.15);
    if(i < 11){ h = (Math.imul(h, 1103515245) + 12345) >>> 0; v += (((h >>> 16) % 7) - 3) * cur * 0.006; }
    pts.push(+Math.max(dec?0.1:1, v).toFixed(dec));
  }
  pts[11] = +cur.toFixed(dec);
  const curPct = gkNum((k.trend||'').replace('%',''));
  let h2 = 536119969;
  for(let i=0;i<label.length;i++){ h2 ^= label.charCodeAt(i); h2 = Math.imul(h2, 16777619) >>> 0; }
  const pct12 = [];
  for(let i=0;i<12;i++){
    h2 = (Math.imul(h2, 1103515245) + 12345) >>> 0;
    pct12.push(+(((h2 >>> 16) % 12) * 0.5 + 0.6).toFixed(1));
  }
  pct12[11] = isFinite(curPct) ? +curPct.toFixed(1) : null;
  const W = 640, H = 210, L = 8, R = 8, T = 14, B = 20;
  const plotH = H - T - B;
  const lMax = Math.max(...pts) * 1.2;
  const pMin = Math.min(...pct12.map(v=>v==null?0:v)) * 0.8;
  const pMax = Math.max(...pct12.map(v=>v==null?0:v)) * 1.25 || 1;
  const step = (W - L - R) / 12;
  const bw = Math.min(26, step * 0.5);
  const X = i => L + step * i + step / 2;
  const Y = v => T + plotH * (1 - v / lMax);
  const Yp = v => T + plotH * (1 - (v - pMin) / ((pMax - pMin) || 1));
  const y0 = Y(0);
  let grid = '', bars = '', line = '', dots = '', xl = '', hov = '';
  [0.5, 1].forEach(f=>{
    const gy = Y(lMax * f).toFixed(1);
    grid += `<line x1="${L}" y1="${gy}" x2="${W-R}" y2="${gy}" stroke="#e6eef8" stroke-width="1" stroke-dasharray="4 4"/>`;
  });
  grid += `<line x1="${L}" y1="${y0.toFixed(1)}" x2="${W-R}" y2="${y0.toFixed(1)}" stroke="#cfd8e3" stroke-width="1"/>`;
  pts.forEach((v,i)=>{
    const x = X(i) - bw/2, y = Y(v), r = Math.min(3.5, bw/2);
    bars += `<path class="gk-wc-bar" d="M${x.toFixed(1)} ${y0.toFixed(1)} L${x.toFixed(1)} ${(y+r).toFixed(1)} Q${x.toFixed(1)} ${y.toFixed(1)} ${(x+r).toFixed(1)} ${y.toFixed(1)} L${(x+bw-r).toFixed(1)} ${y.toFixed(1)} Q${(x+bw).toFixed(1)} ${y.toFixed(1)} ${(x+bw).toFixed(1)} ${(y+r).toFixed(1)} L${(x+bw).toFixed(1)} ${y0.toFixed(1)} Z" fill="url(#gkWC${uid})"/>`;
    xl += `<text x="${X(i).toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="8" fill="#9bb8d8">${i+1}月</text>`;
    hov += `<rect class="gk-t12-hover" x="${(L+step*i).toFixed(1)}" y="${T}" width="${step.toFixed(1)}" height="${plotH}" fill="transparent" data-t12-i="${i}" data-t12-m="${i+1}月" data-t12-v="${v}" data-t12-u="${k.unit||''}" data-t12-c="${cap}" data-t12-p="${pct12[i]==null?'':pct12[i]}"/>`;
  });
  pct12.forEach((v,i)=>{
    if(v == null) return;
    line += (line?' L':'M') + X(i).toFixed(1) + ' ' + Yp(v).toFixed(1);
    dots += `<circle cx="${X(i).toFixed(1)}" cy="${Yp(v).toFixed(1)}" r="2.6" fill="#fff" stroke="#2f9bf2" stroke-width="1.5"/>`;
  });
  return `<div class="gk-wide-chart">`
    + `<div class="gk-wide-head"><span class="gk-wide-title">近12月月度波动</span>`
    + `<span class="gk-wide-legend"><span><i class="lb"></i>本月末数</span><span><i class="ll"></i>同比</span></span></div>`
    + `<svg viewBox="0 0 ${W} ${H}">`
    + `<defs><linearGradient id="gkWC${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0a63a"/><stop offset="1" stop-color="#f8d488"/></linearGradient></defs>`
    + grid + bars
    + `<path d="${line}" fill="none" stroke="#2f9bf2" stroke-width="1.6"/>`
    + dots + xl + hov
    + `</svg></div>`;
}
/* 多口径指标卡：卡内嵌口径小药丸切换（各指标口径集合独立）；切换仅重渲染本卡 */

/* 完成度环：蓝→绿渐变圆弧，中心百分比（实际/全年预算） */
function gkGaugeSvg(pct, idx){
  const C = 2*Math.PI*38;
  const shown = Math.max(0, Math.min(100, pct));
  const dash = (C*shown/100).toFixed(1);
  return `<svg class="gk-gauge" width="92" height="92" viewBox="0 0 92 92">`
    + `<defs><linearGradient id="gkG${idx}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d6ef0"/><stop offset="1" stop-color="#7ed957"/></linearGradient></defs>`
    + `<circle cx="46" cy="46" r="38" fill="none" stroke="#e6edf5" stroke-width="9"/>`
    + `<circle cx="46" cy="46" r="38" fill="none" stroke="url(#gkG${idx})" stroke-width="9" stroke-linecap="round" stroke-dasharray="${dash} ${C.toFixed(1)}" transform="rotate(-90 46 46)"/>`
    + `<text x="46" y="44" text-anchor="middle" font-size="15" font-weight="800" fill="#33475f">${pct.toFixed(2)}%</text>`
    + `<text x="46" y="58" text-anchor="middle" font-size="9" fill="#8aa2bd">完成度</text>`

function getColTypes(headers){
  const row1 = headers[0];
  const row2 = headers[1] || [];
  const cols = [];
  row1.forEach(h=>{
    const c = h.c || 1;
    const r = h.r || 1;
    for(let k=0;k<c;k++) cols.push({label:h.l, r:r});
  });
  let j = 0;
  cols.forEach(col=>{
    if(col.r <= 1){
      if(row2[j]) col.label = row2[j].l;
      j++;
    }
  });
  return cols.map(col=>{
    const l = col.label;
    if(/指标名称/.test(l)) return 'name';
    if(/指标属性标签|是否考核/.test(l)) return 'assess';
    if(/预算进度|预算达成率/.test(l)) return 'progress';
    if(/同比|较年初|环比/.test(l)) return 'delta';
    if(/指标类|指标项|指标口径/.test(l)) return 'group';
    if(/监管要求/.test(l)) return 'req';
    if(/^单位$/.test(l)) return 'unit';
    return 'value';
  });
}

/* 按口径/报表隐藏列：hideCols 项为「整列组名」(r>1，如 监管要求) 或「组/叶」(如 当月值/实际)；
   返回重建后的 {headers, rows, levels, spans}（表头两级重排、行单元格与合并列号同步移位） */
function hideColsView(s, hideCols, src){
  const base = src || s;
  const row1 = s.headers[0], row2 = s.headers[1] || [];
  const leaves = []; let j = 0;
  row1.forEach(h=>{
    const c = h.c || 1, r = h.r || 1;
    for(let k=0;k<c;k++){
      if(r > 1){ leaves.push({group:h.l, label:h.l, r:r}); }
      else { leaves.push({group:h.l, label:(row2[j] ? row2[j].l : h.l), r:1}); j++; }
    }
  });
  const hidden = [];
  leaves.forEach((L,i)=>{
    const key = (L.r > 1) ? L.group : (L.group + '/' + L.label);
    if(hideCols.indexOf(key) >= 0) hidden.push(i);
  });
  if(!hidden.length) return {headers:s.headers, rows:base.rows, levels:base.levels, spans:base.spans};
  const keep = leaves.filter((L,i)=>hidden.indexOf(i) < 0);
  const h1 = [], h2 = [];
  let i = 0;
  while(i < keep.length){
    const L = keep[i];
    if(L.r > 1){ h1.push({l:L.group, r:L.r}); i++; continue; }
    let e = i;
    while(e < keep.length && keep[e].r <= 1 && keep[e].group === L.group) e++;
    h1.push({l:L.group, c:e - i});
    for(let k=i;k<e;k++) h2.push({l:keep[k].label});
    i = e;
  }
  const rows = (base.rows || []).map(r=>r.filter((v,idx)=>hidden.indexOf(idx) < 0));
  let spans = base.spans;
  if(spans){
    spans = spans.map(sp=>Object.assign({}, sp, {col: sp.col - hidden.filter(h=>h < sp.col).length}));
  }
  return {headers:[h1,h2], rows:rows, levels:base.levels, spans:spans};
}

function renderTable(s, colTypes, has){
  let html = '<table class="data-table"><thead>';
  s.headers.forEach((lvl, i)=>{
    html += '<tr' + (i>0?' class="sub-head"':'') + '>';
    lvl.forEach(h=>{
      const rs = h.r?' rowspan="'+h.r+'"':'';
      const cs = h.c?' colspan="'+h.c+'"':'';
      html += '<th'+rs+cs+'>'+h.l+'</th>';
    });
    html += '</tr>';
  });
  html += '</thead><tbody>';
  const spanMap = buildSpanMap(s.spans);
  s.rows.forEach((r,i)=>{
    html += renderTableRow(r, colTypes, (s.levels && s.levels[i]) || 0, i, spanMap, has);
  });
  html += '</tbody></table>';
  return html;
}

/* rowspan 合并配置：spans=[{col,row,rs}] → "row,col" -> rs(合并起点) 或 0(被合并覆盖,跳过输出) */
function buildSpanMap(spans){
  if(!spans) return null;
  const m = {};
  spans.forEach(sp=>{
    m[sp.row+','+sp.col] = sp.rs;
    for(let k=1;k<sp.rs;k++) m[(sp.row+k)+','+sp.col] = 0;
  });
  return m;
}

/* ===== 指标分类筛选（s.catFilter 报表专用，如 ins02 业务指标）===== */
const catFilterState = {}; // key -> 当前所选分类（默认取 options[0]=全部）

/* 按分类切分视图：分类列（col）值空时向上继承上一非空值；
   过滤行后同步重映射 levels 与 spans（合并起点行位移、跨出保留区的行剔除） */
function filterCatView(view, cat, col){
  if(!cat || cat === '全部') return view;
  const keep = [];
  let cur = '';
  view.rows.forEach((r,i)=>{
    if(r[col]) cur = r[col];
    if(cur === cat) keep.push(i);
  });
  if(keep.length === view.rows.length) return view;
  const idxMap = {};
  keep.forEach((oldI,newI)=>{ idxMap[oldI] = newI; });
  let spans = null;
  if(view.spans){
    spans = view.spans.map(sp=>{
      if(idxMap[sp.row] === undefined) return null; // 合并起点被过滤 → 整段剔除
      let rs = 0;
      for(let k=0;k<sp.rs;k++) if(idxMap[sp.row+k] !== undefined) rs++;
      return {col:sp.col, row:idxMap[sp.row], rs:rs};
    }).filter(sp=>sp && sp.rs>0);
  }
  return {
    headers: view.headers,
    rows: keep.map(i=>view.rows[i]),
    levels: view.levels ? keep.map(i=>view.levels[i]) : null,
    spans: spans
  };
}

/* 分类筛选切换后仅重渲染该报表的明细表（table-wrap），KPI 概览与筛选条不动 */
function rerenderCatTable(key){
  const s = sheetByKey(key);
  const panel = document.getElementById('panel-'+key);
  if(!s || !s.catFilter || !panel) return;
  const wrap = panel.querySelector('.table-card .table-wrap');
  if(!wrap) return;
  const has = sheetHasData(key, s);
  const baseView = s.hideCols ? hideColsView(s, s.hideCols) : s;
  const view = filterCatView(baseView, catFilterState[key], s.catFilter.col);
  wrap.innerHTML = renderTable(view, getColTypes(view.headers), has);
}

function renderTableRow(r, colTypes, lv, rowIdx, spanMap, has){
  // 整行为空 → 子表分隔行（华润信托 03/04/05 表内含多个子表，Excel 以空行分隔）
  if(!r.length || r.every(v=>v===null||v==='')){
    return '<tr class="row-sep"><td colspan="'+colTypes.length+'"></td></tr>';
  }
  let cells = '';
  r.forEach((val, i)=>{
    let rsAttr = '';
    if(spanMap){
      const m = spanMap[rowIdx+','+i];
      if(m === 0) return; // 被上方合并单元格覆盖，跳过本格
      if(m > 1) rsAttr = ' rowspan="'+m+'"';
    }
    const t = colTypes[i];
    // 无历史数据期间：数值类单元格置 null（渲染为 N/A）；名称/单位/考核/口径等结构列保留
    const v = (has === false && (t === 'value' || t === 'delta' || t === 'progress')) ? null : val;
    if(t === 'name'){
      cells += `<td${rsAttr} class="indicator-name lv${lv||0}">${val||'<span class="dim-dash">--</span>'}</td>`;
    } else if(t === 'assess'){
      // 考核指标（★/是）→ 蓝色标签「考核指标」；高质量指标 → 绿色标签（.assess-tag.hq）；
      // 双标签并存：值以 | 分隔（如「★|高质量指标」，2026-09-24 华润银行 06-存贷结构/08-客群结构）；其余非空原样显示、空值显示 --
      const parts = String(val==null?'':val).split('|');
      const on = parts.indexOf('★')>=0 || parts.indexOf('是')>=0;
      const hq = parts.indexOf('高质量指标')>=0;
      let tag = '';
      if(on) tag += '<span class="assess-tag">考核指标</span>';
      if(hq) tag += '<span class="assess-tag hq">高质量指标</span>';
      if(!tag) tag = val ? val : '<span class="dim-dash">--</span>';
      cells += `<td${rsAttr} class="assess">${tag}</td>`;
    } else if(t === 'delta'){
      cells += renderDeltaCell(v);
    } else if(t === 'progress'){
      cells += renderProgressCell(v);
    } else if(t === 'group' || t === 'req'){
      cells += `<td${rsAttr}>${val||''}</td>`;
    } else if(t === 'unit'){
      cells += `<td${rsAttr} class="value">${val||''}</td>`;
    } else {
      const disp = (v===null) ? '<span class="dim-na">N/A</span>' : ((v===''||v==='-') ? '<span class="dim-dash">--</span>' : v);
      cells += `<td${rsAttr} class="value">${disp}</td>`;
    }
  });
  return `<tr>${cells}</tr>`;
}

/* 指标卡片同比/较年初：正数红▲、负数绿▼、零/空灰色 */
function deltaSpan(val){
  /* 约定：取不到数据（null/空）→ N/A；数据级占位 dash → --（统一 dim 样式） */
  if(val===null || val===undefined || val===''){
    return '<span class="dim-na">N/A</span>';
  }
  if(val==='-'){
    return '<span class="dim-dash">--</span>';
  }
  const num = parseFloat(String(val).replace(/[,，\s]/g,'').replace(/%|ppt/gi,''));
  if(isNaN(num) || num===0){
    return `<span class="kpi-delta neutral">${val}</span>`;
  }
  if(num > 0){
    return `<span class="kpi-delta up">▲ ${val}</span>`;
  }
  return `<span class="kpi-delta down">▼ ${val}</span>`;
}

function renderDeltaCell(val){
  // 同比/较年初单元格：正数红(▲)、负数绿(▼)、零灰色无箭头；取不到→N/A；占位 dash→--
  if(val===null || val===undefined || val===''){
    return `<td class="yoy neutral"><span class="dim-na">N/A</span></td>`;
  }
  if(val==='-'){
    return `<td class="yoy neutral"><span class="dim-dash">--</span></td>`;
  }
  const num = parseFloat(String(val).replace(/[,，\s]/g,'').replace(/%|ppt/gi,''));
  if(isNaN(num) || num===0){
    return `<td class="yoy neutral">${val}</td>`;
  }
  if(num > 0){
    return `<td class="yoy up"><span class="delta-arrow">▲</span>${val}</td>`;
  }
  return `<td class="yoy down"><span class="delta-arrow">▼</span>${val}</td>`;
}

function renderProgressCell(progress){
  if(progress===null || progress===undefined){
    return `<td class="progress-cell"><span class="dim-na">N/A</span></td>`;
  }
  if(progress==='-' || progress===''){
    return `<td class="progress-cell"><span class="dim-dash">--</span></td>`;
  }
  const num = parseFloat(progress);
  const pct = Math.min(Math.max(num,0),100);
  const cls = pct>=95?'':pct>=85?'mid':'low';
  return `<td class="progress-cell">
    <div class="progress-bar-wrap">
      <div class="progress-bar"><div class="progress-fill ${cls}" style="width:${pct}%"></div></div>
      <span class="progress-text">${progress}</span>
    </div>
  </td>`;
}

   台账 key（led- 前缀）回落到原固定报表数据模型 */
function sheetByKey(key){
  if(key && key.indexOf('led-') === 0){
    const bk = key.slice(4);
    if(SHEETS && SHEETS[bk]) return SHEETS[bk];
    if(typeof ASSET_SHEETS!=='undefined' && ASSET_SHEETS[bk]) return ASSET_SHEETS[bk];
    if(typeof TRUST_SHEETS!=='undefined' && TRUST_SHEETS[bk]) return TRUST_SHEETS[bk];
    if(typeof INSURANCE_SHEETS!=='undefined' && INSURANCE_SHEETS[bk]) return INSURANCE_SHEETS[bk];
    if(typeof LEASE_SHEETS!=='undefined' && LEASE_SHEETS[bk]) return LEASE_SHEETS[bk];
    return null;
  }
  if(SHEETS && SHEETS[key]) return SHEETS[key];
  if(typeof ASSET_SHEETS!=='undefined' && ASSET_SHEETS[key]) return ASSET_SHEETS[key];
  if(typeof TRUST_SHEETS!=='undefined' && TRUST_SHEETS[key]) return TRUST_SHEETS[key];
  if(typeof INSURANCE_SHEETS!=='undefined' && INSURANCE_SHEETS[key]) return INSURANCE_SHEETS[key];
  if(typeof LEASE_SHEETS!=='undefined' && LEASE_SHEETS[key]) return LEASE_SHEETS[key];
  return null;
}

/* 数据可用性：本平台数据基准为 2025 年，默认自 2025-01 起有数据；
   单张报表可用 s.dataFrom（如 '2023-01'）覆盖起始期间 */
const DATA_DEFAULT_FROM = '2025-01';
function periodVal(y, m){ return y * 100 + m; }

/* 所选数据日期是否有历史数据（早于起始期间 → 结构保留、数值置「-」） */
function sheetHasData(key, s){
  const sh = s || sheetByKey(key);
  if(!sh) return true;
  const ySel = document.querySelector(`select.ym-select[data-key="${key}"][data-part="year"]`);
  const mSel = document.querySelector(`select.ym-select[data-key="${key}"][data-part="month"]`);
  if(!ySel || !mSel) return true;
  const [fy, fm] = (sh.dataFrom || DATA_DEFAULT_FROM).split('-').map(Number);
  return periodVal(+ySel.value, +mSel.value) >= periodVal(fy, fm);
}

function querySheet(key){
  const y = document.querySelector(`select.ym-select[data-key="${key}"][data-part="year"]`);
  const mo = document.querySelector(`select.ym-select[data-key="${key}"][data-part="month"]`);
  if(!y || !mo) return;
  const sheet = sheetByKey(key);
  const dateText = (sheet && sheet.freq === '季度')
    ? y.value + '年Q' + (+mo.value / 3)
    : y.value + '年' + mo.value + '月';
  const has = sheetHasData(key, sheet);
  renderPanel(key, sheet); // 按是否有数据重渲染：无数据期间保留结构、数值置「-」
  showToast(has
    ? `已加载 ${dateText} 数据 · ${sheet?sheet.title:key}`
    : `${dateText} 无历史数据，仅显示报表结构 · ${sheet?sheet.title:key}`);
  refreshSheet(key);
}

function toggleOverview(key){
  const area = document.getElementById('overview-'+key);
  const bar = document.querySelector(`.collapse-bar[data-key="${key}"]`);
  if(!area || !bar) return;
  const collapsed = area.classList.toggle('collapsed');
  bar.classList.toggle('expanded', !collapsed);
  const hint = bar.querySelector('.collapse-hint');
  if(hint) hint.textContent = collapsed ? '点击展开 ▾' : '点击收起 ▴';
}

function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'toast';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ============================================================
   指标标准库（指标查询模块）
   数据源：indicator_standard_data.js（INDICATOR_STANDARD）
   ============================================================ */
const STD_DATA = (typeof INDICATOR_STANDARD !== 'undefined') ? INDICATOR_STANDARD : null;
const stdState = { kw:'', bizUnit:'', caliber:[], freq:[], timeDim:[], assess:[], page:1, pageSize:10 };

/* ===== 指标主题树形多选（主题→一级→二级→三级；复选框级联；选中叶子决定过滤集合） ===== */
let stdTreeRoots = [];          // 主题根节点
const stdTreeMap = {};          // id → node{ id,label,children,leaves,items }
const stdItemLeaf = {};         // item.no → 叶子节点 id（指标在该树上的最深分类）
const stdLeafChecked = new Set();// 已勾选的叶子 id
let stdTreeOpen = new Set();    // 已展开节点 id
let stdSelNosCache = null;      // 选中叶子覆盖的指标 no 缓存
function stdBuildThemeTree(){
  stdTreeRoots = [];
  Object.keys(stdTreeMap).forEach(k=>delete stdTreeMap[k]);
  Object.keys(stdItemLeaf).forEach(k=>delete stdItemLeaf[k]);
  if(!STD_DATA || !STD_DATA.items) return;
  STD_DATA.items.forEach(it=>{
    const path = [it.theme, it.cat1, it.cat2, it.cat3]
      .map(v=>String(v==null?'':v).trim())
      .filter(v=>v && !stdIsEmpty(v));
    if(!path.length) return;
    let list = stdTreeRoots, acc = '';
    path.forEach(seg=>{
      acc = acc ? acc + '/' + seg : seg;
      if(!stdTreeMap[acc]){
        const node = { id:acc, label:seg, children:[], leaves:[], items:[] };
        stdTreeMap[acc] = node;
        list.push(node);
      }
      const node = stdTreeMap[acc];
      node.items.push(it.no);
      list = node.children;
    });
    stdTreeMap[acc].leaves.push(acc); // 最深节点记为叶子（自身）
    stdItemLeaf[it.no] = acc;
  });
  // 自底向上汇总每个节点下的全部叶子
  const collect = n => { n.children.forEach(c=>{ collect(c); c.leaves.forEach(l=>{ if(n.leaves.indexOf(l)<0) n.leaves.push(l); }); }); };
  stdTreeRoots.forEach(collect);
  stdTreeOpen = new Set(stdTreeRoots.map(n=>n.id)); // 默认展开主题层
}
function stdNodeState(node){
  let c = 0;
  node.leaves.forEach(l=>{ if(stdLeafChecked.has(l)) c++; });
  return { checked: c>0 && c===node.leaves.length, indet: c>0 && c<node.leaves.length };
}
function stdTreePopHtml(){
  const walk = (n, depth)=>{
    const st = stdNodeState(n);
    const kids = n.children.length;
    const open = stdTreeOpen.has(n.id);
    let h = '<div class="std-tree-row" style="padding-left:' + (10 + depth*22) + 'px">'
      + '<input type="checkbox" class="std-tree-cb" data-action="std-tree-check" data-node="' + escHtml(n.id) + '"' + (st.checked?' checked':'') + '>'
      + '<span class="std-tree-exp' + (kids?'':' none') + '" data-action="std-tree-open" data-node="' + escHtml(n.id) + '">' + (kids ? (open?'▼':'▶') : '') + '</span>'
      + '<span class="std-tree-lb" data-action="std-tree-flip" data-node="' + escHtml(n.id) + '" title="' + escHtml(n.label) + '">' + escHtml(n.label) + '</span>'
      + '</div>';
    if(kids && open) h += n.children.map(c=>walk(c, depth+1)).join('');
    return h;
  };
  return stdTreeRoots.map(n=>walk(n,0)).join('') || '<div class="std-tree-row">暂无分类数据</div>';
}
function stdRenderTreePop(){
  const pop = document.getElementById('stdThemeTreePop');
  if(!pop) return;
  pop.innerHTML = stdTreePopHtml();
  // 半选态（部分子叶子勾选）
  pop.querySelectorAll('input.std-tree-cb').forEach(cb=>{
    const n = stdTreeMap[cb.dataset.node];
    cb.indeterminate = n ? stdNodeState(n).indet : false;
  });
}
function stdTreeSelNos(){
  if(stdSelNosCache) return stdSelNosCache;
  const s = new Set();
  stdLeafChecked.forEach(l=>{
    const n = stdTreeMap[l];
    if(n) n.items.forEach(no=>s.add(no));
  });
  stdSelNosCache = s;
  return s;
}
function stdTreeApplySel(){
  stdSelNosCache = null;
  stdRenderTreePop();
  const sel = document.getElementById('stdThemeTreeSel');
  if(sel){
    const n = stdLeafChecked.size;
    sel.textContent = n ? ('已选 ' + n + ' 项分类') : '请选择';
    sel.className = 'std-tree-sel' + (n ? '' : ' placeholder');
  }
  applyStd();
}
function stdSetNodeChecked(id, on){
  const n = stdTreeMap[id];
  if(!n) return;
  n.leaves.forEach(l=>{ on ? stdLeafChecked.add(l) : stdLeafChecked.delete(l); });
  stdTreeApplySel();
}
function stdResetTree(){
  stdLeafChecked.clear();
  stdTreeApplySel();
}

/* 指标分组编号：优先取数据源 groupCode（金控&资产梳理表真实列，STR_CRA_GROUP_########）；
   缺失时回退按「一级分类」全库出现顺序派生（GRP001…），保证同一分类编号恒定 */
const STD_GROUP = (()=>{

// 判断字段值是否为空/未提供（待补充、不涉及、暂无、-）
function stdIsEmpty(v){
  const s = String(v==null?'':v).trim();
  if(!s) return true;
  if(/^(-|—|暂无|无|不涉及)$/.test(s)) return true;
  if(/^待[一-龥]{0,8}补充$/.test(s)) return true;

function stdFiltered(){
  const kw = stdState.kw.trim().toLowerCase();
  const selNos = stdLeafChecked.size ? stdTreeSelNos() : null;
  return STD_DATA.items.filter(it=>{
    if(selNos && !selNos.has(it.no)) return false;
    if(stdState.bizUnit && String(it.bizUnit==null?'':it.bizUnit).trim()!==stdState.bizUnit) return false;
    if(stdState.freq.length && stdState.freq.indexOf(String(it.freq==null?'':it.freq).trim()) < 0) return false;
    if(stdState.timeDim.length && stdState.timeDim.indexOf(String(it.timeDim==null?'':it.timeDim).trim()) < 0) return false;
    if(stdState.assess.length){
      const av = String(it.assess==null?'':it.assess).trim();
      if(!stdState.assess.some(k=>(STD_ASSESS_MAP[k]||[k]).indexOf(av)>=0)) return false;
    }
    if(stdState.caliber.length && stdState.caliber.indexOf(String(it.caliber==null?'':it.caliber).trim()) < 0) return false;
    /* 编号/名称合并搜索：任一命中即保留 */
    if(kw && String(it.code==null?'':it.code).toLowerCase().indexOf(kw) < 0
        && String(it.name==null?'':it.name).toLowerCase().indexOf(kw) < 0) return false;
    return true;
  });
}

function applyStd(resetPage){
  if(resetPage!==false) stdState.page = 1;
  renderStdResult(stdFiltered());
}

function stdCatPath(it){
  return [it.cat1, it.cat2, it.cat3].filter(v=>v && v!=='不涉及');
}

// 大小写不敏感的关键字高亮（英文关键字如 aum/AUM 均可命中）
function stdMark(text, kw){
  if(!kw) return escHtml(text);
  const s = String(text==null?'':text);
  const i = s.toLowerCase().indexOf(kw.toLowerCase());
  if(i<0) return escHtml(s);
  return escHtml(s.slice(0,i)) + '<mark>' + escHtml(s.slice(i, i+kw.length)) + '</mark>' + escHtml(s.slice(i+kw.length));
}

// 指标状态圆点标识：未发布橙 / 已发布绿 / 已下线（及其余）灰
function stdStatusHtml(v){
  if(stdIsEmpty(v)) return '<span class="tag-none">—</span>';
  const s = String(v);
  const cls = s==='已发布' ? 'pub' : (s==='未发布' ? 'unpub' : 'off');
  return '<span class="std-status ' + cls + '">' + escHtml(s) + '</span>';
}

function renderStdResult(rows){
  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total / stdState.pageSize));
  if(stdState.page > pages) stdState.page = pages;
  const cur = stdState.page;
  const pageRows = rows.slice((cur-1)*stdState.pageSize, (cur-1)*stdState.pageSize + stdState.pageSize);

  /* 总数移至底部分页条（「共 X 条」置于每页条数之前）；列表上方摘要行已删除 */
  const totalEl = document.getElementById('stdPagerTotal');
  if(totalEl) totalEl.textContent = '共 ' + total + ' 条';
  /* 顶部三卡随筛选联动 */
  renderStdStats(rows);

  const table = document.getElementById('stdTable');
  if(!pageRows.length){
    table.innerHTML = '<tbody><tr><td colspan="18"><div class="query-empty">🔍 未查询到匹配的指标标准，请调整关键字或筛选条件</div></td></tr></tbody>';
  }else{
    const kw = stdState.kw.trim();
    // 列宽定义（前四列冻结：序号 44 / 指标标准编号 140 / 指标分组编号 180 / 业务单元 110；口径列已前置至名称前；右侧冻结：操作 84；指标属性标签列加宽容纳双标签文本）
    const colW = [44,140,180,110,118,180,110,120,120,240,96,92,70,84,150,84,160,84];
    let html = '<colgroup>' + colW.map(w=>'<col style="width:'+w+'px">').join('') + '</colgroup>';
    html += '<thead><tr>'
      + '<th class="stick stick-1">序号</th>'
      + '<th class="stick stick-2">指标标准编号</th>'
      + '<th class="stick stick-3">指标分组编号</th>'
      + '<th class="stick stick-4">业务单元</th>'
      + '<th>指标口径</th>'
      + '<th>指标名称</th>'
      + '<th>指标主题</th>'
      + '<th>一级分类</th>'
      + '<th>二级分类</th>'
      + '<th>指标定义</th>'
      + '<th>时间维度</th>'
      + '<th>指标类型</th>'
      + '<th>指标单位</th>'
      + '<th>更新频次</th>'
      + '<th>指标属性标签</th>'
      + '<th>版本号</th>'
      + '<th>安全级别</th>'
      + '<th class="stick-r">操作</th>'
      + '</tr></thead><tbody>';
    // 普通文本单元格：空值显示「—」，超出一行自动换行，title 提供全文；cls 附加冻结列类
    const txt = (v, left, cls)=>{
      const c = [left?'t-left':'', cls||''].filter(Boolean).join(' ');
      const attr = c ? ' class="' + c + '"' : '';
      if(stdIsEmpty(v)) return '<td' + attr + '><span class="tag-none">—</span></td>';
      return '<td' + attr + ' title="' + escHtml(v) + '">' + escHtml(v) + '</td>';
    };
    pageRows.forEach(it=>{
      const typeCls = it.type==='派生指标' ? 'derived' : 'base';
      const grp = stdGroupCode(it);
      html += '<tr data-no="' + it.no + '">'
        + '<td class="std-no stick stick-1">' + it.no + '</td>'
        + '<td class="std-code stick stick-2">' + escHtml(it.code) + '</td>'
        + '<td class="std-code stick stick-3">' + (grp ? escHtml(grp) : '<span class="tag-none">—</span>') + '</td>'
        + txt(it.bizUnit, false, 'stick stick-4')
        + '<td><span class="std-badge neutral">' + escHtml(it.caliber||'—') + '</span></td>'
        + '<td class="t-left"><div class="std-name">' + stdMark(it.name, kw) + '</div></td>'
        + txt(it.theme)
        + txt(it.cat1)
        + txt(it.cat2)
        + txt(it.definition, true)
        + txt(it.timeDim)
        + '<td><span class="std-badge ' + typeCls + '">' + escHtml(it.type||'—') + '</span></td>'
        + (stdIsEmpty(it.unit) ? '<td><span class="tag-none">—</span></td>' : '<td>' + escHtml(it.unit) + '</td>')
        + (stdIsEmpty(it.freq) ? '<td><span class="tag-none">—</span></td>' : '<td>' + escHtml(it.freq) + '</td>')
        + (()=>{ const d = stdAssessDisp(it.assess);
            if(d===null) return '<td><span class="dim-dash">--</span></td>';
            /* 两者都有：考核指标(蓝)/高质量指标(绿) 两枚徽章分别标识，不合并 */
            if(String(it.assess==null?'':it.assess).trim()==='两者都是')
              return '<td><span class="std-badge base">考核指标</span><span class="std-badge hq">高质量指标</span></td>';
            return '<td><span class="std-badge ' + stdAssessBadge(it.assess) + '">' + escHtml(d) + '</span></td>'; })()
        + txt(it.version)
        + (stdIsEmpty(it.securityLevel) ? '<td><span class="tag-none">—</span></td>'
          : '<td><span class="std-sec ' + (String(it.securityLevel).indexOf('L1')===0 ? 'l1' : String(it.securityLevel).indexOf('L2')===0 ? 'l2' : String(it.securityLevel).indexOf('L4')===0 ? 'l4' : 'l3') + '" title="' + escHtml(it.securityLevel) + '">' + escHtml(it.securityLevel) + '</span></td>')
        + '<td class="stick-r"><button class="link-btn" data-action="std-detail" data-no="' + it.no + '" type="button">详情 →</button></td>'
        + '</tr>';
    });
    html += '</tbody>';
    table.innerHTML = html;
  }
  renderStdPager(pages, cur);
}

function renderStdPager(pages, cur){
  const wrap = document.getElementById('stdPagerBtns');
  if(pages <= 1){ wrap.innerHTML = ''; return; }
  let html = '<button class="std-page" data-action="std-page" data-page="' + (cur-1) + '"' + (cur<=1?' disabled':'') + ' type="button">‹ 上一页</button>';
  const nums = [];
  for(let p=1; p<=pages; p++){
    if(p===1 || p===pages || Math.abs(p-cur)<=2) nums.push(p);
    else if(nums[nums.length-1] !== '…') nums.push('…');
  }
  nums.forEach(p=>{
    if(p==='…'){ html += '<span class="std-page-dots">…</span>'; }
    else{
      html += '<button class="std-page' + (p===cur?' active':'') + '" data-action="std-page" data-page="' + p + '" type="button">' + p + '</button>';
    }
  });
  html += '<button class="std-page" data-action="std-page" data-page="' + (cur+1) + '"' + (cur>=pages?' disabled':'') + ' type="button">下一页 ›</button>';
  wrap.innerHTML = html;
}

// 详情抽屉：按 基础信息/业务属性/技术属性/管理属性 分组展示全部字段
function openStdDetail(no){
  const it = STD_DATA.items.find(x=>x.no===no);
  if(!it) return;
  const m = STD_DATA.meta;
  const path = stdCatPath(it).join(' / ');
  let head = '<div class="std-drawer-head">'
    + '<div class="std-drawer-title">' + escHtml(it.name) + '</div>'
    + '<div class="std-drawer-code">' + escHtml(it.code) + (path ? '　·　' + escHtml(path) : '') + '</div>'
    + '<div class="std-drawer-tags">'
    +   '<span class="std-badge base"><em>指标主题：</em>' + escHtml(stdIsEmpty(it.theme)?'—':it.theme) + '</span>'
    +   '<span class="std-badge neutral"><em>指标口径：</em>' + escHtml(stdIsEmpty(it.caliber)?'—':it.caliber) + '</span>'
    +   '<span class="std-badge neutral"><em>业务单元：</em>' + escHtml(stdIsEmpty(it.bizUnit)?'—':it.bizUnit) + '</span>'
    +   '<span class="std-badge neutral"><em>更新频次：</em>' + escHtml(stdIsEmpty(it.freq)?'—':it.freq) + '</span>'
    +   (it.isRegulatory==='是' ? '<span class="std-badge reg">监管指标</span>' : '')
    + '</div>'
    + '<button class="std-drawer-close" data-action="std-close" type="button" title="关闭">✕</button>'
    + '</div>';
  let body = '';
  const rowsHtml = list => list.map(f=>{
    /* 指标属性标签：显示值映射（考核指标/高质量指标/考核指标、高质量指标；两者都不是→--） */
    if(f.key==='assess'){
      const d = stdAssessDisp(it[f.key]);
      return '<tr><th>' + escHtml(f.label) + '</th>'
        + '<td' + (d?'':' class="empty"') + '>' + (d ? escHtml(d) : '<span class="dim-dash">--</span>') + '</td></tr>';
    }
    const v = it[f.key];
    const empty = stdIsEmpty(v);
    return '<tr><th>' + escHtml(f.label) + '</th>'
      + '<td class="' + (empty?'empty':'') + '">' + (empty ? '—' : escHtml(v)) + '</td></tr>';
  }).join('');
  /* 业务/技术/管理属性：3 个 tab 页签切换查看（基础信息字段已并入业务属性，无独立分区） */
  const tabGroups = m.groups.filter(g=>g.key!=='basic');
  body += '<div class="std-tabs">'
    + tabGroups.map((g,i)=>'<button type="button" class="std-tab' + (i===0?' active':'') + '" data-action="std-tab" data-tab="' + g.key + '">' + escHtml(g.label) + '</button>').join('')
    + '</div>';
  tabGroups.forEach((g,i)=>{
    body += '<div class="std-tab-pane' + (i===0?' active':'') + '" data-pane="' + g.key + '">'
      + '<table class="std-detail-table"><tbody>'
      + rowsHtml(m.fields.filter(f=>f.group===g.key && f.key!=='no'))
      + '</tbody></table></div>';
  });
  const drawer = document.getElementById('stdDrawer');
  drawer.innerHTML = head + '<div class="std-drawer-body">' + body + '</div>';
  drawer.classList.add('show');
  drawer.setAttribute('aria-hidden','false');
  document.getElementById('stdOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeStdDetail(){
  document.getElementById('stdDrawer').classList.remove('show');
  document.getElementById('stdDrawer').setAttribute('aria-hidden','true');
  document.getElementById('stdOverlay').classList.remove('show');
  document.body.style.overflow = '';
}

// 顶部导航模块切换：data=数据应用 / cock=驾驶舱（独立全屏模块） / query=指标查询
function switchModule(mod){
  const dataEl = document.getElementById('moduleData');
  const dataWasHidden = dataEl.style.display === 'none';
  document.querySelectorAll('.topnav-item').forEach(b=>{
    b.classList.toggle('active', b.dataset.module===mod);
  });
  dataEl.style.display = (mod==='data') ? '' : 'none';
  document.getElementById('moduleQuery').style.display = (mod==='query') ? '' : 'none';
  document.getElementById('moduleCock').style.display = (mod==='cock') ? '' : 'none';
  if(mod==='query'){
    initStdModule();
    window.scrollTo({top:0});
  }else if(mod==='cock'){
    window.scrollTo({top:0});
  }else{
    closeStdDetail();
    /* 仅当从其他模块进入数据应用（模块原为隐藏）且无选中报表时，默认展示资产负债简表；
       模块内切换报表不触发，否则非银行报表会被抢回 01 */
    if(dataWasHidden){
      /* 已有任意报表面板激活（含刚切换的非银行报表）则不兜底 */
      const anyRep = Array.prototype.some.call(document.querySelectorAll('.sheet-panel'), p=>
        p.classList.contains('active') && p.id.indexOf('panel-cock-') !== 0);
      if(!anyRep) switchTab('01');
      /* 从其他模块切回时回到页顶，避免视口停留在旧滚动位置看似「没反应」 */
      window.scrollTo({top:0});
    }
  }
}

// 全局事件委托：顶部导航模块切换 + 查询/导出 + 指标查询操作
document.addEventListener('click', (e)=>{
  const nav = e.target.closest('[data-module]');
  if(nav){
    if(nav.dataset.module==='cock'){
      /* 「驾驶舱」顶导航：仅开合子菜单；页面切换由子菜单项触发 */
      const drop = document.getElementById('cockNavDrop');
      if(drop) drop.classList.toggle('open');
      return;
    }
    switchModule(nav.dataset.module);
    return;
  }
  /* 指标主题树下拉：点击其外部时收起 */
  const treeWrap0 = document.getElementById('stdThemeTree');
  if(treeWrap0 && treeWrap0.classList.contains('show') && !e.target.closest('.std-treeselect')) treeWrap0.classList.remove('show');
  /* 多选下拉（口径/频次/时间维度/考核）：点击其外部时收起 */
  STD_MS_KEYS.forEach(k=>{
    const w0 = document.getElementById('stdMs-' + k);
    if(w0 && w0.classList.contains('show') && !(e.target.closest && e.target.closest('#stdMs-' + k))) w0.classList.remove('show');
  });
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;
  const key = btn.dataset.key;
  if(action === 'query') querySheet(key);
  else if(action === 'export') exportSheet(key);
  else if(action === 'toggle-overview') toggleOverview(key);
  else if(action === 'caliber-switch'){
    // 指标口径页签切换：同步切换当前报表面板内的页签、概览 KPI 与明细面板
    const panel = btn.closest('.sheet-panel');
    if(panel){
      const pane = btn.dataset.pane;
      panel.querySelectorAll('.caliber-tab').forEach(b=>b.classList.toggle('active', b===btn));
      panel.querySelectorAll('.caliber-pane').forEach(p=>p.classList.toggle('active', p.dataset.pane===pane));
    }
  }
  else if(action === 'ledger-caliber'){
    /* 台账口径页签切换：记录所选口径 → 按该口径指标行重算各月末台账值并整面板重渲染 */
    const lk = btn.dataset.key;
    ledgerCalSel[lk] = parseInt(btn.dataset.pane, 10) || 0;
    const s = sheetByKey(lk.slice(4));
    if(s) renderLedgerPanel(lk.slice(4), s);
  }
  else if(action === 'cat-filter'){
    // 指标分类筛选：切换按钮激活态 → 记录状态 → 仅重渲染明细表
    const bar = btn.closest('.cat-filter');
    if(bar) bar.querySelectorAll('.cat-filter-btn').forEach(b=>b.classList.toggle('active', b===btn));
    catFilterState[key] = btn.dataset.cat;
    rerenderCatTable(key);
  }
  else if(action === 'cock-toggle'){
    const sel = btn.closest('.fz-select');
    if(sel) sel.classList.toggle('open');
  }
  else if(action === 'cock-page'){
    /* 顶部「驾驶舱」子菜单：切换驾驶舱页面（switchTab 内同步选中态并收起子菜单） */
    switchTab(btn.dataset.key);
  }
  else if(action === 'cock-company'){
    const sel = btn.closest('.fz-select');
    if(sel) sel.classList.remove('open');
    const grp = COCKPITS.find(c=>c.key==='group');
    if(grp) renderCockCompanyView(grp, parseInt(btn.dataset.idx,10));
  }
  else if(action === 'gk-cal'){
    /* 集团总览-口径页签切换：重渲染该分组卡片为所选口径的值 */
    const gi = parseInt(btn.dataset.gid,10), calIdx = parseInt(btn.dataset.cal,10);
    const co = GQ_VIEW.c && GQ_VIEW.c.companies ? GQ_VIEW.c.companies[GQ_VIEW.idx] : null;
    const g = co && co.groups ? co.groups[gi] : null;
    if(g){
      const sw = document.getElementById('gk-calswitch-'+gi);
      if(sw) sw.querySelectorAll('.gk-caltab').forEach((t,i)=>t.classList.toggle('active', i===calIdx));
      const rowEl = document.getElementById('gk-calrows-'+gi);
      if(rowEl){
        let n = 0;
        rowEl.innerHTML = g.picks.map(p=>{
          const k = cockPick(Object.assign({}, p, {cal:calIdx}));
          return k ? groupCardHtml(k, n++) : '';
        }).join('');
      }
    }
  }
  else if(action === 'gk-mcal'){
    /* 多口径指标卡：卡内药丸切换，仅重渲染本卡 */
    const uid = parseInt(btn.dataset.uid,10), ci = parseInt(btn.dataset.cal,10);
    const p = GK_MCAL[uid];
    const el = document.getElementById('gk-mcal-' + uid);
    if(p && el) el.outerHTML = mcalCardHtml(p, ci, uid);
  }
  else if(action === 'nav-sheet'){
    /* 左侧报表菜单点击：切换报表并滚动到内容区顶部（保证切换可见） */
    switchTab(btn.dataset.sheet, true);
  }
  else if(action === 'nav-toggle'){
    btn.classList.toggle('open');
    if(btn.nextElementSibling) btn.nextElementSibling.classList.toggle('open');
  }
  else if(action === 'std-tree-toggle'){
    const wrap = document.getElementById('stdThemeTree');
    if(wrap){ if(!wrap.classList.contains('show')) stdRenderTreePop(); wrap.classList.toggle('show'); }
  }
  else if(action === 'std-tree-open'){
    const tid = btn.dataset.node;
    if(stdTreeOpen.has(tid)) stdTreeOpen.delete(tid); else stdTreeOpen.add(tid);
    stdRenderTreePop();
  }
  else if(action === 'std-tree-check'){
    stdSetNodeChecked(btn.dataset.node, !!btn.checked);
  }
  else if(action === 'std-tree-flip'){
    const tn = stdTreeMap[btn.dataset.node];
    if(tn) stdSetNodeChecked(tn.id, !stdNodeState(tn).checked);
  }
  else if(action === 'std-ms-toggle'){
    const mw = document.getElementById('stdMs-' + btn.dataset.ms);
    if(mw){ if(!mw.classList.contains('show')) stdRenderMsPop(btn.dataset.ms); mw.classList.toggle('show'); }
  }
  else if(action === 'std-ms-check'){
    stdToggleMs(btn.dataset.ms, btn.dataset.val, !!btn.checked);
  }
  else if(action === 'std-ms-flip'){
    stdToggleMs(btn.dataset.ms, btn.dataset.val, stdState[btn.dataset.ms].indexOf(btn.dataset.val) < 0);
  }
  else if(action === 'std-search') applyStd();
  else if(action === 'std-reset') resetStdFilters();
  else if(action === 'std-detail') openStdDetail(parseInt(btn.dataset.no,10));
  else if(action === 'std-tab'){
    /* 详情抽屉页签切换：业务/技术/管理属性 */
    const dEl = document.getElementById('stdDrawer');
    if(dEl){
      dEl.querySelectorAll('.std-tab').forEach(b=>b.classList.toggle('active', b===btn));
      dEl.querySelectorAll('.std-tab-pane').forEach(p=>p.classList.toggle('active', p.dataset.pane===btn.dataset.tab));
    }
  }
  else if(action === 'std-close') closeStdDetail();
  else if(action === 'std-page'){
    const p = parseInt(btn.dataset.page,10);
    if(!isNaN(p) && p>=1){
      stdState.page = p;
      applyStd(false);
      const el = document.getElementById('stdMain');
      if(el){
        const y = el.getBoundingClientRect().top + window.pageYOffset - 66;
        window.scrollTo({top:Math.max(y,0), behavior:'smooth'});
      }
    }
  }
});

// 指标标准库：点击表格行打开详情
document.addEventListener('click', (e)=>{
  if(e.target.closest('[data-action]') || e.target.closest('[data-module]')) return;
  const row = e.target.closest('tr[data-no]');
  if(row) openStdDetail(parseInt(row.dataset.no,10));
});

// 指标标准库：点击遮罩或按 Esc 关闭详情抽屉
document.getElementById('stdOverlay').addEventListener('click', closeStdDetail);
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeStdDetail(); });

// 集团总览：点击公司下拉外部时收起；驾驶舱顶导航子菜单点击外部时收起
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.fz-select')) document.querySelectorAll('.fz-select.open').forEach(s=>s.classList.remove('open'));
  if(!e.target.closest('.topnav-drop')){
    const d = document.getElementById('cockNavDrop');
    if(d) d.classList.remove('open');
  }
});

// 数据日期年/月下拉变更后自动查询；指标标准库筛选条件变更即时查询
document.addEventListener('change', (e)=>{
  const t = e.target;
  if(t.classList && t.classList.contains('ym-select')){
    /* 台账面板（led- 前缀）：仅年度下拉 → 走台账查询 */
    if(t.dataset.key && t.dataset.key.indexOf('led-') === 0) queryLedger(t.dataset.key);
    else querySheet(t.dataset.key);
  }
  if(t.dataset && t.dataset.stdKey){
    stdState[t.dataset.stdKey] = t.value;
    // 业务单元变更 → 指标口径联动刷新（清空已选口径、重建候选清单）
    if(t.dataset.stdKey==='bizUnit') stdUpdateCaliberCombo();
    applyStd();
  }
});
</script>
<script>
(function(){
  switchTab("led-01");
  function size(){
    var w = document.documentElement.scrollWidth, H = Math.ceil(document.documentElement.scrollHeight);
    // 面板内横向滚动表格：按最宽 table 展开（撑开容器避免截断）
    document.querySelectorAll('#panel-' + "led-01" + ' .table-wrap').forEach(function(el){
      var t = el.querySelector('table');
      if(t) w = Math.max(w, Math.ceil(el.getBoundingClientRect().left + t.scrollWidth + 36));
    });
    return [Math.ceil(w), H];
  }
  setTimeout(function(){ var s = size(); document.title = 'PAGESIZE=' + s[0] + 'x' + s[1]; }, 300);
})();
</script></body>
